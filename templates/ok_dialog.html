{% extends "base.html" %}

{% block content %}
<div class="container mt-5 text-center">
    <div class="alert alert-success shadow p-4 rounded" role="alert">
        <h4 class="alert-heading">✅ Success!</h4>
        <p>{{ msg }}</p>
        <hr>
        <a href="{{ redirect_url or '/mainAdmin' }}" class="btn btn-primary mt-3">
            {{ button_text or 'Go Back' }}
        </a>
    </div>
</div>
{% endblock %}
